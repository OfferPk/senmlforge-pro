<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812"/>
      <stop offset="100%" stop-color="#0a1124"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#8338ec"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg-grad)"/>

  <!-- Window Header / Frame -->
  <rect x="40" y="30" width="1120" height="640" rx="12" fill="#0a1124" stroke="#1a2d54" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Window Controls -->
  <circle cx="70" cy="55" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="55" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="55" r="6" fill="#27c93f"/>
  <text x="140" y="60" fill="#8b9db8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SenMLForge Pro — IETF RFC 8428 Sensor Measurement Lists Studio</text>

  <!-- Top App Navigation / Badges -->
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#1a2d54" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <rect x="70" y="100" width="80" height="34" rx="6" fill="url(#accent-grad)"/>
  <text x="76" y="123" fill="#000" font-family="monospace" font-size="13" font-weight="800">SenML</text>
  <text x="165" y="118" fill="#f0f4fc" font-family="sans-serif" font-size="18" font-weight="700">SenMLForge Pro</text>
  <text x="165" y="134" fill="#8b9db8" font-family="sans-serif" font-size="12">IETF RFC 8428 Sensor Measurement Lists (SenML) Studio &amp; CBOR Telemetry Dissector</text>

  <!-- Tags -->
  <rect x="880" y="104" width="110" height="24" rx="4" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="1"/>
  <text x="892" y="120" fill="#00e5ff" font-family="sans-serif" font-size="11" font-weight="600">IETF RFC 8428</text>
  
  <rect x="1000" y="104" width="110" height="24" rx="4" fill="rgba(0, 230, 118, 0.15)" stroke="#00e676" stroke-width="1"/>
  <text x="1012" y="120" fill="#00e676" font-family="sans-serif" font-size="11" font-weight="600">10/10 PASS</text>

  <!-- Metrics Grid -->
  <rect x="70" y="155" width="150" height="50" rx="6" fill="#101c38" stroke="#1a2d54"/>
  <text x="85" y="172" fill="#8b9db8" font-family="sans-serif" font-size="10" font-weight="700">CBOR WIRE OVERHEAD</text>
  <text x="85" y="194" fill="#00e5ff" font-family="sans-serif" font-size="16" font-weight="800">58 Bytes</text>

  <rect x="235" y="155" width="150" height="50" rx="6" fill="#101c38" stroke="#1a2d54"/>
  <text x="250" y="172" fill="#8b9db8" font-family="sans-serif" font-size="10" font-weight="700">WIRE COMPRESSION</text>
  <text x="250" y="194" fill="#00e676" font-family="sans-serif" font-size="16" font-weight="800">58.4% vs JSON</text>

  <rect x="400" y="155" width="150" height="50" rx="6" fill="#101c38" stroke="#1a2d54"/>
  <text x="415" y="172" fill="#8b9db8" font-family="sans-serif" font-size="10" font-weight="700">802.15.4 MTU FIT</text>
  <text x="415" y="194" fill="#00e5ff" font-family="sans-serif" font-size="16" font-weight="800">100% (58/127B)</text>

  <!-- Main Left Card: Parameters -->
  <rect x="70" y="220" width="500" height="420" rx="8" fill="#101c38" stroke="#1a2d54" stroke-width="1"/>
  <text x="90" y="248" fill="#f0f4fc" font-family="sans-serif" font-size="14" font-weight="700">SenML Pack Configuration</text>

  <text x="90" y="280" fill="#8b9db8" font-family="sans-serif" font-size="11" font-weight="600">BASE NAME (BN)</text>
  <rect x="90" y="290" width="460" height="34" rx="4" fill="#070d1e" stroke="#1a2d54"/>
  <text x="102" y="312" fill="#00e5ff" font-family="monospace" font-size="12">urn:dev:mac:001425701234/</text>

  <text x="90" y="345" fill="#8b9db8" font-family="sans-serif" font-size="11" font-weight="600">BASE UNIT (BU)</text>
  <rect x="90" y="355" width="460" height="34" rx="4" fill="#070d1e" stroke="#1a2d54"/>
  <text x="102" y="377" fill="#f0f4fc" font-family="monospace" font-size="12">W (Watts / Active Power)</text>

  <text x="90" y="410" fill="#8b9db8" font-family="sans-serif" font-size="11" font-weight="600">TELEMETRY RECORDS (JSON)</text>
  <rect x="90" y="420" width="460" height="80" rx="4" fill="#070d1e" stroke="#1a2d54"/>
  <text x="102" y="442" fill="#9cdcfe" font-family="monospace" font-size="10">[ { "n": "active_power", "v": 3450.2 },</text>
  <text x="102" y="460" fill="#9cdcfe" font-family="monospace" font-size="10">  { "n": "voltage", "u": "V", "v": 240.1, "t": 1 },</text>
  <text x="102" y="478" fill="#9cdcfe" font-family="monospace" font-size="10">  { "n": "current", "u": "A", "v": 14.37, "t": 1 } ]</text>

  <rect x="90" y="520" width="220" height="36" rx="6" fill="#00e5ff"/>
  <text x="110" y="543" fill="#000" font-family="sans-serif" font-size="12" font-weight="700">Forge SenML Pack</text>

  <!-- Main Right Card: Dissected Structure & Hex Viewer -->
  <rect x="590" y="220" width="530" height="420" rx="8" fill="#03060c" stroke="#1a2d54" stroke-width="1"/>
  <text x="610" y="248" fill="#8b9db8" font-family="sans-serif" font-size="12" font-weight="600">SENML CBOR BINARY STREAM &amp; RESOLVED NORMALIZED</text>
  <line x1="590" y1="260" x2="1120" y2="260" stroke="#1a2d54" stroke-width="1"/>

  <g font-family="monospace" font-size="11" fill="#9cdcfe">
    <text x="610" y="285">[</text>
    <text x="630" y="305">{</text>
    <text x="650" y="325"><tspan fill="#4ec9b0">"name"</tspan>: <tspan fill="#ce9178">"urn:dev:mac:001425701234/active_power"</tspan>,</text>
    <text x="650" y="345"><tspan fill="#4ec9b0">"time"</tspan>: <tspan fill="#b5cea8">1782910000</tspan>,</text>
    <text x="650" y="365"><tspan fill="#4ec9b0">"unit"</tspan>: <tspan fill="#ce9178">"W"</tspan>,</text>
    <text x="650" y="385"><tspan fill="#4ec9b0">"value"</tspan>: <tspan fill="#b5cea8">3450.2</tspan></text>
    <text x="630" y="405">},</text>
    <text x="630" y="425">{</text>
    <text x="650" y="445"><tspan fill="#4ec9b0">"name"</tspan>: <tspan fill="#ce9178">"urn:dev:mac:001425701234/voltage"</tspan>,</text>
    <text x="650" y="465"><tspan fill="#4ec9b0">"time"</tspan>: <tspan fill="#b5cea8">1782910001</tspan>,</text>
    <text x="650" y="485"><tspan fill="#4ec9b0">"unit"</tspan>: <tspan fill="#ce9178">"V"</tspan>,</text>
    <text x="650" y="505"><tspan fill="#4ec9b0">"value"</tspan>: <tspan fill="#b5cea8">240.1</tspan></text>
    <text x="630" y="525">}</text>
    <text x="610" y="545">]</text>
  </g>

  <!-- Live Audit Badge -->
  <rect x="610" y="565" width="490" height="34" rx="4" fill="rgba(0, 230, 118, 0.1)" stroke="#00e676" stroke-width="1"/>
  <text x="625" y="587" fill="#00e676" font-family="sans-serif" font-size="12" font-weight="700">✓ IETF RFC 8428 &amp; CBOR Audit: 10/10 PASS (100% Compliant)</text>
</svg>
